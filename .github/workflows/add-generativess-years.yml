name: Fix GENERATIVESS manifest metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-generativess-years.yml'

permissions:
  contents: write

jobs:
  fix-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild manifest from canonical literature list
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          base = Path('literature')
          with (base/'GENERATIVESS_list.csv').open(encoding='utf-8-sig', newline='') as f:
              master = list(csv.DictReader(f))
          with (base/'GENERATIVESS_pdf_manifest.csv').open(encoding='utf-8-sig', newline='') as f:
              old = list(csv.DictReader(f))
          status = {r['paper_id']: r.get('pdf_status','') for r in old}
          assert len(master) == 288 and len(status) == 288
          with (base/'GENERATIVESS_pdf_manifest.csv').open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=['paper_id','Title','Year','Link','pdf_status'])
              w.writeheader()
              for r in master:
                  w.writerow({'paper_id':r['paper_id'],'Title':r['Title'],'Year':r['Year'],'Link':r['Link'],'pdf_status':status[r['paper_id']]})
          PY
      - name: Commit manifest fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add literature/GENERATIVESS_pdf_manifest.csv
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Fix GENERATIVESS manifest metadata'
            git push
          fi
